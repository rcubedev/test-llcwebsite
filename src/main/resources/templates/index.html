<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}">
<body>
<main>
  <section th:replace="~{home/hero :: hero}"></section>

  <!--/*
    Stacking cards: each card scrolls up, then stays pinned while the next one slides over it.
    Cards must stay direct children of this section for the pinning (position: sticky) to last
    until the end of the section. site.js works out where each card pins.
    Each card's content lives in templates/home/<id>.html.
  */-->
  <section data-scroll-cards>
    <th:block th:each="card, it : ${ {'about', 'timeline', 'sponsors', 'faq', 'team'} }">
      <!-- Marks where the card starts, for #links (the card itself moves while pinned) -->
      <div th:attr="data-card-anchor=${card}"></div>

      <!-- grid: the card's content fills the full screen height, so it can centre itself -->
      <div th:id="${card}" data-card th:style="'z-index: ' + ${it.count}"
           class="relative grid min-h-[100svh] bg-[var(--background)] px-4 py-6 md:px-6">
        <article th:replace="~{${'home/' + card} :: card}"></article>
      </div>

      <!-- Extra scroll so each card sits fully visible before the next one covers it -->
      <div th:unless="${it.last}" aria-hidden="true" style="height: 40vh"></div>
    </th:block>
  </section>

  <div th:replace="~{fragments/modals :: video}"></div>
</main>
</body>
</html>
