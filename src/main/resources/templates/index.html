<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::main})}">
    <body>
        <main>
            <section th:replace="~{home/hero :: hero}"></section>

            <section data-scroll-cards>
                <th:block th:each="card, it : ${ {'about', 'timeline', 'sponsors', 'faq', 'team'} }">
                    <div th:attr="data-card-anchor=${card}"></div>
                    <div th:id="${card}" data-card
                         th:style="'--card-index: ' + ${it.count}"
                         class="relative z-[var(--card-index)] grid min-h-[100svh] bg-[var(--background)] px-4 py-6 md:px-6">
                        <article th:replace="~{${'home/' + card} :: card}"></article>
                    </div>
                    <div th:unless="${it.last}" aria-hidden="true" class="h-[40vh]"></div>
                </th:block>
            </section>

            <div th:replace="~{fragments/modals :: video}"></div>
        </main>
    </body>
</html>
