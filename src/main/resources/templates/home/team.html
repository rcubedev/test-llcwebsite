<html xmlns:th="http://www.thymeleaf.org">

<article th:fragment="card" class="relative h-full overflow-hidden bg-[var(--background)]">
  <div class="flex h-full flex-col justify-between px-6 py-12 md:px-16 md:py-16">
    <span class="font-body text-sm uppercase tracking-[0.15em]">TEAM</span>

    <div>
      <h2 class="relative inline-block font-display text-[clamp(4rem,9vw,9rem)] leading-[0.82] tracking-[-0.07em]">
        The
        <br>
        <span class="relative inline-block font-bold text-[var(--ontik-accent)]">team.<svg th:replace="~{fragments/art :: squiggleTeam('pointer-events-none absolute left-0 top-full mt-1 h-auto w-full')}"></svg></span>
      </h2>

      <div class="relative mt-24">
        <svg th:replace="~{fragments/art :: sparkle('pointer-events-none absolute -top-10 right-4 h-14 w-10 rotate-[-16deg] text-[var(--foreground)] md:-top-20 md:right-34 md:h-16 md:w-12')}"></svg>
        <svg th:replace="~{fragments/art :: sparkle('pointer-events-none absolute -top-10 right-4 h-14 w-10 rotate-[8deg] text-[var(--ontik-accent)] md:-top-24 md:right-10 md:h-20 md:w-14')}"></svg>

        <!--/*
          Marquee: the team is repeated 4 times and the track slides left by exactly one copy
          ((176px card + 24px gap) per person), so the loop is seamless.
        */-->
        <div class="overflow-hidden [mask-image:linear-gradient(to_right,transparent,black_5%,black_95%,transparent)]">
          <div class="marquee-team flex w-max gap-6"
               th:style="'--marquee-distance: ' + ${200 * #lists.size(site.team)} + 'px'">
            <th:block th:each="copy : ${#numbers.sequence(1, 4)}">
              <div th:each="person : ${site.team}" class="group flex w-44 shrink-0 flex-col gap-3"
                   th:attr="aria-hidden=${copy > 1} ? 'true' : null">
                <div class="relative aspect-[3/4] w-full">
                  <div class="absolute inset-0 translate-x-0 translate-y-0 bg-[var(--ontik-accent)] transition-transform duration-150 group-hover:translate-x-2 group-hover:translate-y-2"></div>
                  <div class="absolute inset-0 overflow-hidden border-2 border-black bg-[var(--surface)]">
                    <img th:src="${person.image}" th:alt="${person.name}" width="176" height="235" loading="lazy"
                         class="h-full w-full object-cover">
                  </div>
                </div>

                <div>
                  <p class="font-display font-bold" th:text="${person.name}">Name</p>
                  <p class="font-body text-sm text-[var(--foreground)]/70" th:text="${person.position}">Role</p>
                </div>
              </div>
            </th:block>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>

</html>
