<!--/* @thymesVar id="meta" type="org.limelightcreatives.site.web.PageMeta" */-->
<!--/* @thymesVar id="assets" type="org.limelightcreatives.site.web.Assets" */-->
<!--/* @thymesVar id="site" type="org.limelightcreatives.site.content.SiteContent" */-->

<!-- shared shell pg every pg uses  -->
<!DOCTYPE html>
<html lang="en" class="h-full antialiased" xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title th:text="${meta.title}">Limelight Creatives</title>
        <meta name="description" th:content="${meta.description}">

        <link th:if="${meta.indexed}" rel="canonical" th:href="${meta.url}">
        <meta th:unless="${meta.indexed}" name="robots" content="noindex">

        <meta name="theme-color" content="#fffdf5">
        <link rel="icon" th:href="${assets.url('/favicon.ico')}">

        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Limelight Creatives">
        <meta property="og:locale" content="en_AU">
        <meta property="og:title" th:content="${meta.title}">
        <meta property="og:description" th:content="${meta.description}">
        <meta th:if="${meta.indexed}" property="og:url" th:content="${meta.url}">
        <meta property="og:image" th:content="|${site.url}${assets.url('/assets/og.jpg')}|">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="High school students at a Limelight film-a-thon">
        <meta name="twitter:card" content="summary_large_image">

        <link rel="preconnect" href="https://embed.fillout.com">

        <link rel="preload" th:href="${assets.url('/fonts/classica/Classica-Book.woff2')}" as="font" type="font/woff2" crossorigin>
        <link rel="preload" th:href="${assets.url('/fonts/classica/Classica-Bold.woff2')}" as="font" type="font/woff2" crossorigin>
        <link rel="preload" th:href="${assets.url('/fonts/hanken-grotesk/HankenGrotesk-Regular.woff2')}" as="font" type="font/woff2" crossorigin>
        <link rel="preload" th:href="${assets.url('/fonts/hanken-grotesk/HankenGrotesk-SemiBold.woff2')}" as="font" type="font/woff2" crossorigin>

        <link rel="stylesheet" th:href="${assets.url('/css/app.css')}">
        <script th:src="${assets.url('/js/site.js')}" defer></script>
    </head>
    <body class="min-h-full flex flex-col">
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <main th:replace="${content}"></main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>

        <th:block th:replace="~{fragments/modals :: apply}"></th:block>
        <th:block th:replace="~{fragments/modals :: sponsor}"></th:block>
    </body>
</html>
