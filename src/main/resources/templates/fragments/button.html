<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="button(href, label, variant, extra)">
    <button th:if="${href == '#apply'}" type="button" data-open-apply
            class="relative border-2 px-4 py-2 font-display font-bold transition-all duration-150 ease-out translate-x-0
                   translate-y-0 shadow-[0_0_0_0_transparent] hover:-translate-x-[2px] hover:-translate-y-[2px]
                   active:translate-x-0 active:translate-y-0 active:shadow-[2px_2px_0_0_var(--foreground)]"
            th:classappend="${(variant == 'secondary'
                ? 'border-[var(--foreground)] bg-transparent text-[var(--foreground)]'
                : 'border-[var(--foreground)] bg-[var(--ontik-accent)] text-[var(--background)]')
                + ' hover:bg-[var(--accent)] hover:text-[var(--foreground)] hover:shadow-[6px_6px_0_0_var(--foreground)] ' + extra}"
            th:text="${label}">REGISTER</button>

    <a th:unless="${href == '#apply'}" th:href="${href}"
       class="relative border-2 px-4 py-2 font-display font-bold transition-all duration-150 ease-out translate-x-0
              translate-y-0 shadow-[0_0_0_0_transparent] hover:-translate-x-[2px] hover:-translate-y-[2px]
              active:translate-x-0 active:translate-y-0 active:shadow-[2px_2px_0_0_var(--foreground)]"
       th:classappend="${(variant == 'secondary'
           ? 'border-[var(--foreground)] bg-transparent text-[var(--foreground)]'
           : 'border-[var(--foreground)] bg-[var(--ontik-accent)] text-[var(--background)]')
           + ' hover:bg-[var(--accent)] hover:text-[var(--foreground)] hover:shadow-[6px_6px_0_0_var(--foreground)] ' + extra}"
       th:text="${label}">LINK</a>
</th:block>
