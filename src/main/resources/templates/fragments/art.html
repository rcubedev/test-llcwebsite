    <!-- white outline + drop shadow behind each sponsor logo -->
    <svg th:fragment="stickerFilter" width="0" height="0" class="absolute" aria-hidden="true">
        <defs>
            <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
                <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="dilated"/>
                <feFlood flood-color="#fff" result="white"/>
                <feComposite in="white" in2="dilated" operator="in" result="outline"/>
                <feDropShadow in="outline" dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35" result="shadowed"/>
                <feMerge>
                    <feMergeNode in="shadowed"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
    </svg>
