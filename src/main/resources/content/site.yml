# Everything on the home page that changes from event to event lives here.
# Edit this file, not the templates, for dates, venues, sponsors, FAQs and the team.
#
# Fields marked (html) are rendered as HTML, so you can use <em> etc.

site:
  # The live address, for search engines and link previews (canonical links, sitemap, og:image).
  url: "https://limelightcreatives.org"

  event:
    banner: "Launching Limelight GENESIS, Oct 24-25 @ La Trobe University Sydney Campus!"
    youtube-id: "DHbpky37LH0"
    fillout-id: "mGGHpnRZ9aus"
    contact-email: "inquiries@limelightcreatives.org"
    parents-guide: "/policies/Limelight%20Genesis%20Parents%20Guide.pdf"

  # Navbar links on the home page
  nav:
    - { label: "ABOUT", target: "about" }
    - { label: "WHAT'S NEXT", target: "timeline" }
    - { label: "SPONSORS", target: "sponsors" }
    - { label: "FAQ", target: "faq" }
    - { label: "TEAM", target: "team" }

  key-dates:
    - { date: "August 30", label: "RSVPs OPEN" }
    - { date: "October 18", label: "REGISTRATION FORM SENT" }
    - { date: "October 24–25", label: "EVENT OPENING DAY!" }

  locations:
    - label: "Opening ceremony"
      venue: "Golden Age Cinema"
      address: "Lower Ground, Paramount House, 80 Commonwealth Street, Surry Hills NSW 2010"
    - label: "Workshops & filming"
      venue: "La Trobe University Sydney"
      address: "255 Elizabeth St, Sydney NSW 2000"

  # "How it works" steps. title is (html).
  steps:
    - n: "01"
      rotate: -1.5
      title: 'Sign up for <em class="accent">Limelight GENESIS</em>'
      image: "/assets/cards/steps/step1.webp"
      image-alt: "Two students working together on a laptop"
    - n: "02"
      rotate: 2
      title: 'Grab <em class="accent">friends</em> (or make new friends!) and form a <em class="accent">team of 3</em>'
      image: "/assets/cards/steps/step2.webp"
      image-alt: "A group of students at the event"
    - n: "03"
      rotate: -2.5
      title: 'Learn from <em class="accent">filmmaking workshops</em>, enjoy <em class="accent">free food and merch!</em>'
      image: "/assets/cards/steps/step3.webp"
      image-alt: "Students holding up their free Limelight merch"
    - n: "04"
      rotate: 1.5
      title: 'Make a film &amp; <em class="accent accent-lime">win awards!</em>'
      image: "/assets/cards/steps/step4.webp"
      image-alt: "A student smiling with the prize he won"

  # kind: open | work | workshop | break | milestone   (milestone rows are highlighted)
  # tag (optional): "Compulsory" gets a filled pill, anything else an outlined one
  schedule:
    - label: "Day one"
      date: "Sat 24 Oct"
      slots:
        - { time: "8:30 AM", name: "Doors open", kind: open }
        - { time: "9:00 AM", name: "Opening ceremony", kind: work }
        - { time: "9:30 AM", name: "Working time", kind: work }
        - { time: "10:00 AM", name: "Storyboarding workshop", kind: workshop, tag: "Compulsory" }
        - { time: "11:30 AM", name: "Filming workshop", kind: workshop, tag: "Optional" }
        - { time: "2:00 PM", name: "Lunch", kind: break }
        - { time: "3:00 PM", name: "Working time", kind: work }
        - { time: "6:30 PM", name: "Day 1 ends", kind: work }
    - label: "Day two"
      date: "Sun 25 Oct"
      slots:
        - { time: "8:30 AM", name: "Doors open", kind: open }
        - { time: "9:00 AM", name: "Working time", kind: work }
        - { time: "1:00 PM", name: "Editing workshop", kind: workshop, tag: "Optional" }
        - { time: "2:00 PM", name: "Lunch", kind: break }
        - { time: "3:00 PM", name: "Working time", kind: work }
        - { time: "3:30 PM", name: "Video submissions", kind: work }
        - { time: "4:30 PM", name: "Judging", kind: work }
        - { time: "5:30 PM", name: "Closing ceremony", kind: work }
        - { time: "6:30 PM", name: "Day 2 ends", kind: work }

