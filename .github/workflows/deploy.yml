name: Deploy
run-name: Deploy '${{ github.event.workflow_run.display_title }}'

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Static Website
        uses: actions/download-artifact@v7
        with:
          name: website-static
          path: build/site/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Preview Alias
        id: alias
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "alias=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          slugify() {
            printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }

          slug=$(slugify "$BRANCH_NAME")
          [[ -n "$slug" ]] || slug="branch"

          clash=false
          while IFS= read -r other; do
            [[ "$other" == "$BRANCH_NAME" ]] && continue
            if [[ "$(slugify "$other")" == "$slug" ]]; then
              clash=true
              break
            fi
          done < <(git ls-remote --heads origin | sed 's|.*refs/heads/||')

          if [[ "$clash" == true || ${#slug} -gt 42 ]]; then
            hash=$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)
            slug="${slug:0:33}"
            slug="${slug%-}-${hash}"
          fi

          echo "alias=${slug}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare Version Message
        id: message
        env:
          COMMIT_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          message=$(printf '%s' "$COMMIT_TITLE" | tr -d '"`$\\' | cut -c1-100)
          echo "message=${message}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.alias.outputs.alias == ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --tag ${{ github.event.workflow_run.head_sha }}
            --message "${{ steps.message.outputs.message }}"

      - name: Deploy branch preview
        if: steps.alias.outputs.alias != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --preview-alias ${{ steps.alias.outputs.alias }}
            --tag ${{ github.event.workflow_run.head_sha }}
            --message "${{ steps.message.outputs.message }}"
