name: Build site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Runs the tests, then renders the static site into build/site
      - run: ./gradlew build :build-logic:test exportSite

      # The ready-to-host site. Add a deploy step for your host after this.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
